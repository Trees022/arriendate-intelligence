name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARRIENDATE_DATABASE_URL: sqlite+aiosqlite:///./.local/ci.db
      ARRIENDATE_SEED_DEMO_DATA: "false"
      ARRIENDATE_AI_PROVIDER: disabled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e "./apps/api[dev]"

      - name: Ruff
        run: python -m ruff check apps/api evals/scripts

      - name: mypy
        run: python -m mypy apps/api/app

      - name: Backend tests
        run: python -m pytest apps/api/tests -q

      - name: Offline lead extraction evaluation
        run: python evals/scripts/evaluate_lead_extraction.py --mode fixture

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:web

      - name: TypeScript typecheck
        run: npm run typecheck:web

      - name: Frontend tests
        run: npm run test:web

      - name: Production build
        run: npm run build:web
